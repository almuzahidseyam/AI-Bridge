<!DOCTYPE html>
<html>
<head>
    <title>AI-Bridge</title>
    <style>
        body { width: 320px; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; }
        .container { display: flex; flex-direction: column; gap: 12px; }
        .header { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; }
        h2 { margin: 0; font-size: 20px; color: #58a6ff; letter-spacing: 0.5px; }
        .badge { background: #1f6feb; color: white; padding: 2px 6px; border-radius: 12px; font-size: 10px; font-weight: bold; }
        p { font-size: 13px; text-align: center; color: #8b949e; margin-top: -5px; margin-bottom: 15px; }
        button { padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s ease; }
        #exportBtn { background: #238636; color: white; border: 1px solid rgba(240, 246, 252, 0.1); }
        #exportBtn:hover { background: #2ea043; transform: translateY(-1px); }
        #injectBtn { background: #21262d; color: #c9d1d9; border: 1px solid rgba(240, 246, 252, 0.1); }
        #injectBtn:hover { background: #30363d; color: white; transform: translateY(-1px); }
        #status { font-size: 13px; text-align: center; margin-top: 15px; padding: 10px; border-radius: 6px; background: rgba(0,0,0,0.2); min-height: 20px; font-weight: 500; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>AI-Bridge</h2><span class="badge">PRO</span>
        </div>
        <p>Seamless Context Transfer</p>
        
        <button id="exportBtn">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M2.75 14A1.75 1.75 0 0 1 1 12.25v-2.5a.75.75 0 0 1 1.5 0v2.5c0 .138.112.25.25.25h10.5a.25.25 0 0 0 .25-.25v-2.5a.75.75 0 0 1 1.5 0v2.5A1.75 1.75 0 0 1 13.25 14Z"></path><path d="M11.78 4.72a.749.749 0 1 1-1.06 1.06L8.75 3.811V9.5a.75.75 0 0 1-1.5 0V3.811L5.28 5.78a.749.749 0 1 1-1.06-1.06l3.25-3.25a.75.75 0 0 1 1.06 0l3.25 3.25Z"></path></svg>
            Extract Chat Context
        </button>
        
        <button id="injectBtn">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M2.75 14A1.75 1.75 0 0 1 1 12.25v-2.5a.75.75 0 0 1 1.5 0v2.5c0 .138.112.25.25.25h10.5a.25.25 0 0 0 .25-.25v-2.5a.75.75 0 0 1 1.5 0v2.5A1.75 1.75 0 0 1 13.25 14Z"></path><path d="M8.75 3.75a.75.75 0 0 0-1.5 0v5.69L5.28 7.47a.749.749 0 1 0-1.06 1.06l3.25 3.25a.75.75 0 0 0 1.06 0l3.25-3.25a.749.749 0 1 0-1.06-1.06l-1.97 1.97V3.75Z"></path></svg>
            Inject into New AI
        </button>
        
        <div id="status">Ready to sync.</div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
